name: Ramzinex Paper Trader

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ramzinex-trader
  cancel-in-progress: false

jobs:
  run-trader:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests pandas numpy python-dotenv pynacl
      
      - name: Run Paper Trader
        env:
          NOBITEX_PUBLIC_KEY: ${{ secrets.NOBITEX_PUBLIC_KEY }}
          NOBITEX_PRIVATE_KEY: ${{ secrets.NOBITEX_PRIVATE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python paper_trader.py once
      
      - name: Commit state files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull --rebase origin main || true
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "Update state [skip ci]"
          git push || true